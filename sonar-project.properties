# SonarCloud project config — org/project keys match the SonarCloud
# organization at https://sonarcloud.io/organizations/umahanish, connected
# via the GitHub App integration (same account the repo lives under).
sonar.organization=umahanish
sonar.projectKey=umahanish_delivery-pipeline-sample-app
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Generated by `npm run test:coverage` (vitest.config.ts) before the scan
# step in ci.yml -- without this, SonarCloud sees 0% new-code coverage on
# every PR regardless of how well-tested the change actually is, and the
# quality gate's default 80%-new-coverage condition fails every time. See
# ai-delivery-pipeline's docs/DECISIONS.md and Manual_Test_Case.csv's TC-21.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
